name: Build Turnip A6xx

on:
  workflow_dispatch:
    inputs:
      mesa_commit:
        description: "Mesa commit to build (empty = latest main)"
        required: false
        default: ""
      enable_lto:
        description: "Enable thin-LTO (slower build, usually faster driver)"
        type: boolean
        default: false
      cpu_tune:
        description: "CPU tuning flag. Default targets Snapdragon 865/870 (Cortex-A77/A55). Empty = generic ARMv8"
        required: false
        default: "-mcpu=cortex-a77"
      default_tu_debug:
        description: "TU_DEBUG flags baked into the driver (e.g. nolrz, nolrz,noubwc, sysmem). Empty = none"
        required: false
        default: "nolrz"
      flush_extra:
        description: "Extra flushes at every flush point: ccu_color,ccu_depth,uche_clean,uche_inval,wmw,wfi,wfm,bindless (empty = none)"
        required: false
        default: ""
      sync_mode:
        description: "Selective draw sync: state | program | desc | ps | nops | every:N (empty = off)"
        required: false
        default: ""
      sync_bits:
        description: "Waits to add on those draws: wfi,wmw,wfm"
        required: false
        default: "wfi,wmw,wfm"
      sync_nondraw:
        description: "Sync only at non-draw flush points: wfi,wmw,wfm,flushall (empty = off)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl \
            python3-pip glslang-tools curl zip patch clang lld llvm
          pip3 install --break-system-packages meson mako

      - name: Resolve Mesa commit
        id: mesa
        run: |
          C="${{ inputs.mesa_commit }}"
          if [ -z "$C" ]; then
            C=$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git refs/heads/main | awk '{print $1}')
          fi
          test -n "$C"
          echo "commit=$C" >> "$GITHUB_OUTPUT"

      - name: Build A6xx
        env:
          VARIANT: a6xx
          BUILD_VERSION: ${{ github.run_number }}
          MESA_COMMIT: ${{ steps.mesa.outputs.commit }}
          ENABLE_LTO: ${{ inputs.enable_lto && '1' || '0' }}
          CPU_TUNE: ${{ inputs.cpu_tune }}
          DEFAULT_TU_DEBUG: ${{ inputs.default_tu_debug }}
          FLUSH_EXTRA: ${{ inputs.flush_extra }}
          SYNC_MODE: ${{ inputs.sync_mode }}
          SYNC_BITS: ${{ inputs.sync_bits }}
          SYNC_NONDRAW: ${{ inputs.sync_nondraw }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Verify ZIP
        run: |
          test "$(find turnip_workdir -maxdepth 1 -name 'Turnip_*.zip' | wc -l)" -eq 1
          unzip -t turnip_workdir/Turnip_*.zip
          unzip -p turnip_workdir/Turnip_*.zip meta.json | python3 -m json.tool

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A6xx
          path: turnip_workdir/Turnip_*.zip

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="a6xx-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" turnip_workdir/Turnip_*.zip \
            --title "Turnip A6xx - $TAG" \
            --notes "Adreno 6xx build, Mesa ${{ steps.mesa.outputs.commit }}" \
            --repo "$GITHUB_REPOSITORY"
